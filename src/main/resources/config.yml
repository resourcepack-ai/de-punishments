# Verdict - punishments, with a panel drawn in Studio.
#
# Every punishment works two ways:
#   - from the panel: /punish <player> opens a dialog with the player's record,
#     your Reason, Length and Silent picks, and a button per punishment (needs
#     RP Engine and a 1.21.6+ client). The screens ship inside this jar and
#     install into RP Engine's content folder as content/verdict/.
#   - from a plain command, always: /warn /mute /kick /tempban /ban and the
#     rest. The panel's buttons give exactly what these commands give, so the
#     two can never disagree.
#
# Every word players see is in messages.yml (the ones drawn on the panel too).
# /verdict reload reads both.

storage:
  # sqlite: a file in this folder. mysql / mariadb: shared by several servers.
  type: sqlite
  sqlite-file: punishments.db
  table-prefix: verdict_
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    # Added to the connection URL. The driver negotiates TLS on its own when the
    # server offers it; add useSSL=false only for a database on this same machine,
    # because it sends the password in the clear.
    params: "autoReconnect=true"

# Every command's name and aliases, and whether it exists at all. A command
# turned off here is simply not registered (its button in the panel still
# shows, so take that out of dialogs/panel.yml too). A name another plugin
# already owns is taken over, so Verdict's /ban is the /ban.
commands:
  punish:   { enabled: true, name: punish,   aliases: [p, punishments] }
  warn:     { enabled: true, name: warn,     aliases: [] }
  unwarn:   { enabled: true, name: unwarn,   aliases: [delwarn] }
  mute:     { enabled: true, name: mute,     aliases: [tempmute] }
  unmute:   { enabled: true, name: unmute,   aliases: [] }
  kick:     { enabled: true, name: kick,     aliases: [] }
  tempban:  { enabled: true, name: tempban,  aliases: [tban] }
  ban:      { enabled: true, name: ban,      aliases: [] }
  unban:    { enabled: true, name: unban,    aliases: [pardon] }
  history:  { enabled: true, name: history,  aliases: [hist, checkban, warnings] }
  verdict:  { enabled: true, name: verdict,  aliases: [vd] }

# The reasons staff pick from. The key is what a command takes after a #
# (/tempban Steve #hacking), and what the panel's dropdown sends. Each may say
# how long a mute and a temp-ban for it last when no length is given, or when
# the panel's length is left on "Reason's default".
reasons:
  hacking:     { label: "Hacking / cheats",  mute: 1d,   tempban: 30d }
  spam:        { label: "Spam",              mute: 1h,   tempban: 1d }
  toxicity:    { label: "Toxicity",          mute: 6h,   tempban: 3d }
  griefing:    { label: "Griefing",          mute: 1d,   tempban: 7d }
  advertising: { label: "Advertising",       mute: 1d,   tempban: 7d }
  ban-evasion: { label: "Ban evasion",       mute: perm, tempban: perm }
  other:       { label: "Other" }

# What a reason reads as when staff pick one AND type details. {preset} is the
# reason's label, {details} what they typed.
reason-format: "{preset} ({details})"
# When there is no reason at all.
default-reason: "No reason given"
# Refuse a punishment with no reason (console is never refused).
require-reason: false

# What the panel's length dropdown offers. "default" means the picked reason's
# length (above), or default-length (below) when it has none.
lengths:
  - { id: default, label: "Reason's default" }
  - { id: 30m,  label: "30 minutes" }
  - { id: 1h,   label: "1 hour" }
  - { id: 6h,   label: "6 hours" }
  - { id: 1d,   label: "1 day" }
  - { id: 3d,   label: "3 days" }
  - { id: 7d,   label: "7 days" }
  - { id: 30d,  label: "30 days" }
  - { id: perm, label: "Permanent" }

# How long a mute or temp-ban lasts when nothing else says. perm for permanent.
default-length:
  mute: 1h
  tempban: 1d

# Caps on what a staff member may hand out, by permission. A player with
# several of these gets the most generous. Players with none of them (and
# console) have no cap. Lengths over the cap are cut down to it, and the
# staff member is told.
limits:
  helper:
    permission: verdict.limit.helper
    mute: 1d
    tempban: 3d
    permanent-ban: false
  moderator:
    permission: verdict.limit.moderator
    mute: 30d
    tempban: 30d
    permanent-ban: true

warnings:
  # Warnings older than this stop counting toward escalation. 0 = never.
  expire-after: 30d
  # Show a warned player a dialog they have to acknowledge (falls back to chat
  # for clients older than 1.21.6, or without RP Engine). A player who was
  # offline sees it when they next join.
  popup: true
  # When a player reaches a number of warnings, run a command as the console.
  # {target} is the player, {count} their warnings. The command only runs when
  # the staff member who gave the warning has the permission to run it
  # themselves (and verdict.ban.ip for an -ip ban); otherwise they are told,
  # and somebody who does have it has to step in.
  escalation:
    - { count: 3, command: "mute {target} 1h -s #spam Reached {count} warnings" }
    - { count: 5, command: "tempban {target} 1d #other Reached {count} warnings" }

mute:
  # Commands a muted player may not use (any alias the server resolves to
  # these is caught too). Without the slash.
  blocked-commands: [msg, tell, w, whisper, me, r, reply, mail, say, m, pm, dm, t, emsg, etell]
  # Muted players can still use signs and books unless these are on.
  block-signs: true
  block-books: false

protection:
  # Players with this permission cannot be punished (except by console).
  # An offline player counts as exempt if they held it when last online.
  exempt-permission: verdict.exempt
  # Staff can punish themselves (useful only for testing).
  allow-self: false

# Who hears about a punishment. A silent one (-s, or the panel's Silent
# switch) goes only to staff with verdict.notify.
broadcast:
  warn: staff
  mute: everyone
  kick: everyone
  ban: everyone
  # everyone | staff | none for each, and for what lifting one says:
  unmute: staff
  unban: staff
  unwarn: staff

# Dates in /history and the dialogs. Java DateTimeFormatter pattern.
date-format: "d MMM yyyy, HH:mm"
