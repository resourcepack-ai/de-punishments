# One of Punishments' screens, drawn with a resource pack by Dialog Engine.
# Edit it with /de edit punishments:<name>, or by hand here and run /de reload:
# a changed file is redrawn by Studio (resourcepack.ai), which needs the internet.
# An edited screen is kept when Punishments updates; delete its folder to take
# the new version's. Its clicks run /punish and /punishments act ..., which
# Punishments answers, and the words on it come from messages.yml.
title: You have been warned
style: dialog
document:
  column:
    - column:
        - row:
            - space: 3
            - text: Warning
              style: heading
              align: left
              scale: 1
              w: grow
            - space: 2
          w: grow
          h: 15
          gap: 3
          pad: 0
          align: start
          cross: center
          surface: head
          name: Heading
        - column:
            - row:
                - icon: ui:warning
                  size: 9
                - text: "{reason}"
                  style: heading
                  align: left
                  scale: 1
                  w: grow
              w: grow
              h: fit
              gap: 4
              pad: 0
              align: start
              cross: center
            - divider: true
            - pair:
                - From
                - "{actor}"
              style: body
              w: grow
            - pair:
                - When
                - "{date}"
              style: body
              w: grow
            - pair:
                - Warnings
                - "{count}"
              style: gold
              w: grow
            - text: More warnings can lead to a mute or a ban.
              style: muted
              align: left
              scale: 1
              w: fit
          w: grow
          h: fit
          gap: 9
          pad: 5
          align: start
          cross: start
          name: Body
      w: grow
      h: fit
      gap: 0
      pad: 1
      align: start
      cross: start
      surface: sheet
      name: Warning
  w: fit
  h: fit
  gap: 4
  pad: 0
  align: start
  cross: start
  theme:
    face: "#c6c6c6"
    accent: "#d8402f"
contentWidth: 230
columns: 2
canCloseWithEscape: false
pause: true
showWarning: false
afterAction: close
drawButtons: true
nudge:
  x: 0
  y: 0
buttons:
  - id: ok
    label: I understand
    width: 150
    action: run_command
    value: punishments ack {id}
inputs: []
