name: Punishments
version: '${version}'
main: ai.resourcepack.punishments.PunishmentsPlugin
api-version: '1.21'
author: ResourcePack AI
website: https://resourcepack.ai
description: Warn, mute, kick, temp-ban and ban, from a dialog panel or plain commands.
softdepend: [DialogEngine]
# Commands are registered at runtime under the names in config.yml.
permissions:
  punishments.staff:
    description: Every punishment command and the panel.
    default: op
    children:
      punishments.punish: true
      punishments.warn: true
      punishments.unwarn: true
      punishments.mute: true
      punishments.unmute: true
      punishments.kick: true
      punishments.tempban: true
      punishments.ban: true
      punishments.ban.ip: true
      punishments.unban: true
      punishments.history: true
      punishments.revoke: true
      punishments.notify: true
  punishments.admin:
    description: /punishments reload, and everything in punishments.staff.
    default: op
    children:
      punishments.staff: true
  punishments.punish: { description: "/punish, the panel", default: op }
  punishments.warn: { description: "/warn", default: op }
  punishments.unwarn: { description: "/unwarn", default: op }
  punishments.mute: { description: "/mute", default: op }
  punishments.unmute: { description: "/unmute", default: op }
  punishments.kick: { description: "/kick", default: op }
  punishments.tempban: { description: "/tempban", default: op }
  punishments.ban: { description: "/ban, permanent or with a length", default: op }
  punishments.ban.ip: { description: "-ip on a ban, which also bans the address", default: op }
  punishments.unban: { description: "/unban", default: op }
  punishments.history: { description: "/history", default: op }
  punishments.revoke: { description: "/punishments revoke, and Revoke in the history dialog", default: op }
  punishments.notify: { description: "Hear silent punishments and staff-only announcements", default: op }
  punishments.exempt: { description: "Cannot be punished by players", default: false }
  punishments.update: { description: "Being told on joining that a newer Punishments is out", default: op }
